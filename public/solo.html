<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Chase · Solo</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#e7efff;font:15px system-ui}canvas{width:100vw;height:100dvh;display:block;outline:none}header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 26px;background:linear-gradient(#080f1cdd,transparent);pointer-events:none}header a{pointer-events:auto;color:#70dfec}#status{position:fixed;bottom:24px;left:24px;padding:12px 18px;background:#13233bdd;border:1px solid #3a5169;border-radius:10px;font-variant-numeric:tabular-nums}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#07101b99}#overlay[hidden]{display:none}.panel{width:min(520px,92vw);padding:38px;border:1px solid #39516b;background:#101f32ef;border-radius:20px;box-shadow:0 20px 80px #0007}.eyebrow{font:12px monospace;letter-spacing:3px;color:#70dfec}h1{font-size:46px;margin:12px 0}p{color:#b3c3d9;line-height:1.8}button,select{font:inherit;border-radius:8px;padding:12px 16px;margin:6px 4px 6px 0;border:1px solid #49647c;background:#1b334c;color:#e7efff}#start{background:#70dfec;color:#102331;font-weight:700}a{color:#70dfec}#crosshair{position:fixed;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;pointer-events:none}
</style></head><body><canvas tabindex="0" aria-label="第一人称跑酷场景"></canvas><header><b>MAZE CHASE / SOLO</b><a href="https://github.com/HaltCatch/maze-chase">Source &amp; multiplayer server ↗</a></header><div id="crosshair"></div><div id="status">载入中…</div><div id="overlay"><section class="panel"><div class="eyebrow">BROWSER EDITION / PARKOUR</div><h1>Keep moving.</h1><p>收集金币，穿过检查点，抵达绿色终点。<br>WASD 移动 · 鼠标视角 · 空格跳跃 / 二段跳<br>Shift 冲刺 · Esc 暂停。需要键盘和鼠标。</p><label>路线 <select id="course"><option value="skyline">云端跃迁 / Skyline</option><option value="foundry">熔炉试炼 / Foundry</option></select></label><div><button id="start" disabled>载入中…</button><button id="restart">重置路线</button></div><p>无需账号，单人本机运行。完整联机模式需自托管服务器。</p></section></div><script type="module" src="./solo.js"></script></body></html>
